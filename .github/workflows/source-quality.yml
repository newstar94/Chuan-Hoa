name: Source quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rule-only-quality:
    name: Rule-only quality and security
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Run locked quality, privacy, supply-chain and secret-history gates
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\tools\validation\run_source_quality_gates.ps1

      - name: Upload non-secret validation evidence and SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-quality-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            shared/docs/implementation/evidence/document_privacy_regression.json
            shared/docs/implementation/evidence/dotnet_supply_chain.json
            shared/docs/implementation/evidence/nuget_vulnerability_audit.json
            shared/docs/implementation/evidence/product_decision_consistency.json
            shared/docs/implementation/evidence/repository_secret_regression.json
            artifacts/sbom/chuanhoa-dotnet.cdx.json
