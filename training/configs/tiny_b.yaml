# Model configuration for Tiny-B (Primary Context Candidate Ranker)
model_name: "vietnamese-context-ranker-tiny-b"
architecture: "TinyVietnameseContextRanker"
version: "1.0.0"

transformer:
  num_layers: 6
  hidden_size: 320
  num_attention_heads: 8
  intermediate_size: 1280
  hidden_act: "gelu"
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  max_position_embeddings: 128
  vocab_size: 16000
  type_vocab_size: 1

ranking:
  max_candidates: 8
  max_context_length: 64
  score_margin_threshold: 0.15
  min_confidence_threshold: 0.85

training:
  learning_rate: 3e-4
  batch_size: 32
  warmup_ratio: 0.1
  weight_decay: 0.01
  temperature: 2.0
  alpha_supervised: 0.6
  beta_kd: 0.4
